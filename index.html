<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>장보기 가격 비교</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="loadingOverlay">
  <div class="spinner"></div>
  <div style="font-size:13px;color:var(--text3);margin-top:4px">불러오는 중...</div>
</div>

<div id="loginScreen" style="display:none">
  <div class="login-card">
    <div class="login-logo">🛒</div>
    <div class="login-title">장보기 가격 비교</div>
    <div class="login-sub">냉장고 재고와 마켓컬리·쿠팡 가격을<br>한눈에 비교해보세요</div>
    <button class="google-btn" onclick="signInWithGoogle()">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
      Google 계정으로 로그인
    </button>
    <div class="login-note">로그인 시 계정별로 데이터가 저장됩니다</div>
  </div>
</div>

<div id="appScreen">
  <header class="header">
    <div class="header-left">
      <div class="logo">장보기 <span>비교표</span></div>
      <div class="save-dot" id="saveDot" title="저장 상태"></div>
    </div>
    <div class="header-right">
      <div class="user-chip">
        <img class="user-avatar" id="userAvatar" src="" alt="" style="display:none">
        <div class="user-avatar-fallback" id="userFallback" style="display:none"></div>
        <span class="user-name" id="userName"></span>
      </div>
      <button class="btn" onclick="copyText()">📋 복사</button>
      <button class="btn btn-danger" onclick="doSignOut()">로그아웃</button>
    </div>
  </header>
  <main class="main">
    <div class="summary-bar" id="summaryBar"></div>
    <div class="grid" id="mainGrid"></div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script type="module">
// 1. 필요한 Firebase 함수들을 모두 가져옵니다 (버전 통일)
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut as fbSignOut }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// 2. Firebase 설정 (콘솔에서 복사한 값 그대로 유지)
const firebaseConfig = {
  apiKey: "AIzaSyA4ugXKglqEC5Oq4imFWbwFhWUlzGSI0DE",
  authDomain: "jangbogi-6b765.firebaseapp.com",
  projectId: "jangbogi-6b765",
  storageBucket: "jangbogi-6b765.firebasestorage.app",
  messagingSenderId: "976301065070",
  appId: "1:976301065070:web:4c08bb2f47cafeee84777f",
  measurementId: "G-K11HRB2SV8"
};

// 3. 앱과 서비스는 딱 한 번만 초기화합니다 (중복 제거)
const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

// =======================================================================
// 이후부터는 기존 데이터 및 함수 로직과 동일합니다.
// =======================================================================

const DEFAULT_DATA = {
  fridge:  [{id:1,name:'계란 (30구)'},{id:2,name:'우유 1L'},{id:3,name:'두부 300g'}],
  kurly:   [{id:1,name:'유기농 계란 (15구)',price:6800,qty:1,weight:''},{id:2,name:'서울우유 1L',price:2400,qty:2,weight:'1000g'}],
  coupang: [{id:1,name:'동물복지 계란 (30구)',price:11900,qty:1,weight:'1.8kg'},{id:2,name:'매일 우유 1L',price:2100,qty:2,weight:'1000g'}]
};

let state = null;
let currentUser = null;
let nextId = {fridge:200,kurly:200,coupang:200};
let saveTimer = null;

const fmt = n => Number(n||0).toLocaleString('ko-KR');
const esc = s => String(s||'').replace(/"/g,'&quot;').replace(/</g,'&lt;');

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}
function setSaveDot(st){
  const d=document.getElementById('saveDot');
  d.className='save-dot'+(st?' '+st:'');
}

const userDocRef = uid => doc(db,'users',uid,'data','main');

async function loadData(uid){
  const snap = await getDoc(userDocRef(uid));
  if(snap.exists()){
    state = snap.data();
  } else {
    state = JSON.parse(JSON.stringify(DEFAULT_DATA));
    await setDoc(userDocRef(uid), state);
  }
}

function scheduleSave(){
  setSaveDot('saving');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    if(!currentUser) return;
    try {
      await setDoc(userDocRef(currentUser.uid), state);
      setSaveDot('saved');
      setTimeout(()=>setSaveDot(''),2000);
    } catch(e){ showToast('저장 실패: '+e.message); setSaveDot(''); }
  }, 800);
}

window.signInWithGoogle = async () => {
  try { await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch(e){ showToast('로그인 실패: '+e.message); }
};
window.doSignOut = async () => {
  if(!confirm('로그아웃할까요?')) return;
  await fbSignOut(auth);
};

onAuthStateChanged(auth, async user => {
  const overlay  = document.getElementById('loadingOverlay');
  const loginScr = document.getElementById('loginScreen');
  const appScr   = document.getElementById('appScreen');

  if(user){
    currentUser = user;
    try { await loadData(user.uid); }
    catch(e){ state = JSON.parse(JSON.stringify(DEFAULT_DATA)); showToast('데이터 로드 오류'); }

    const avatarEl   = document.getElementById('userAvatar');
    const fallbackEl = document.getElementById('userFallback');
    if(user.photoURL){ avatarEl.src=user.photoURL; avatarEl.style.display='block'; }
    else { fallbackEl.textContent=(user.displayName||'U')[0]; fallbackEl.style.display='flex'; }
    document.getElementById('userName').textContent = user.displayName || user.email;

    loginScr.style.display='none';
    appScr.style.display='block';
    overlay.classList.add('hidden');
    render();
  } else {
    currentUser=null; state=null;
    appScr.style.display='none';
    overlay.classList.add('hidden');
    loginScr.style.display='flex';
  }
});

const PANELS=[
  {key:'fridge', label:'냉장고 재고',      icon:'🧊',cls:'fridge', badgeText:'재고'},
  {key:'kurly',  label:'마켓컬리',         icon:'🛍',cls:'kurly',  badgeText:'Kurly'},
  {key:'coupang',label:'쿠팡 / 쿠팡프레시', icon:'📦',cls:'coupang',badgeText:'Coupang'},
];

function renderFridgeItem(item){
  return `<div class="item" data-id="${item.id}">
    <div class="item-body">
      <input class="name-input" value="${esc(item.name)}" placeholder="품목 이름"
        oninput="updateField('fridge',${item.id},'name',this.value)">
    </div>
    <button class="del-btn" onclick="delItem('fridge',${item.id})">×</button>
  </div>`;
}

function renderShopItem(panel,item){
  const total=(item.price||0)*(item.qty||1);
  return `<div class="item" data-id="${item.id}">
    <div class="item-body">
      <input class="name-input" value="${esc(item.name)}" placeholder="품목 이름"
        oninput="updateField('${panel}',${item.id},'name',this.value)">
      <div class="fields">
        <div class="field"><span class="field-label">가격 (원)</span>
          <input class="field-input" type="number" min="0" value="${item.price||''}" placeholder="0"
            oninput="updateField('${panel}',${item.id},'price',this.value)"></div>
        <div class="field"><span class="field-label">수량</span>
          <input class="field-input" type="number" min="1" value="${item.qty||1}"
            oninput="updateField('${panel}',${item.id},'qty',this.value)"></div>
        <div class="field"><span class="field-label">무게/용량</span>
          <input class="field-input" type="text" value="${esc(item.weight||'')}" placeholder="예) 500g"
            oninput="updateField('${panel}',${item.id},'weight',this.value)"></div>
      </div>
    </div>
    <div class="item-total">${total > 0 ? fmt(total) + '원' : ''}</div>
    <button class="del-btn" onclick="delItem('${panel}',${item.id})">×</button>
  </div>`;
}

function render(){
  if(!state) return;
  document.getElementById('mainGrid').innerHTML=PANELS.map(p=>{
    const items=state[p.key]||[];
    const rows=p.key==='fridge'
      ? items.map(i=>renderFridgeItem(i)).join('')
      : items.map(i=>renderShopItem(p.key,i)).join('');
      
    return `<div class="panel ${p.cls}">
      <div class="panel-header">
        <div class="panel-title"><div class="panel-icon ${p.cls}">${p.icon}</div>${p.label}</div>
        <span class="badge ${p.cls}">${p.badgeText}</span>
      </div>
      <div class="panel-body">
        ${rows||'<div class="empty-state">항목이 없어요</div>'}
        <button class="add-btn" onclick="addItem('${p.key}')">+ 항목 추가</button>
      </div>
    </div>`;
  }).join('');
  renderSummary();
}

function renderSummary(){
  if(!state) return;
  const kT=(state.kurly||[]).reduce((s,i)=>s+(i.price||0)*(i.qty||1),0);
  const cT=(state.coupang||[]).reduce((s,i)=>s+(i.price||0)*(i.qty||1),0);
  const diff=kT-cT;
  let cheaper='';
  if(kT>0&&cT>0){
    if(diff>0) cheaper=`<span class="cheaper-badge">쿠팡이 ${fmt(diff)}원 저렴</span>`;
    else if(diff<0) cheaper=`<span class="cheaper-badge">마켓컬리가 ${fmt(-diff)}원 저렴</span>`;
    else cheaper=`<span class="cheaper-badge">두 곳 동일</span>`;
  }
  document.getElementById('summaryBar').innerHTML=`
    <div class="summary-card fridge">
      <div class="summary-label">🧊 냉장고 재고</div>
      <div class="summary-value">${(state.fridge||[]).length}<span style="font-size:14px;font-weight:400;color:var(--text2);margin-left:4px">품목</span></div>
      <div class="summary-sub">현재 보관 중인 식재료</div>
    </div>
    <div class="summary-card kurly">
      <div class="summary-label">🛍 마켓컬리 합계</div>
      <div class="summary-value">${fmt(kT)}<span style="font-size:14px;font-weight:400;color:var(--text2);margin-left:4px">원</span></div>
      <div class="summary-sub">${(state.kurly||[]).length}개 품목</div>
    </div>
    <div class="summary-card coupang">
      <div class="summary-label">📦 쿠팡 합계</div>
      <div class="summary-value">${fmt(cT)}<span style="font-size:14px;font-weight:400;color:var(--text2);margin-left:4px">원</span></div>
      <div class="summary-sub">${(state.coupang||[]).length}개 품목 &nbsp;${cheaper}</div>
    </div>`;
}

// 👇 수정 3: render() 호출부를 완전히 삭제하고, 해당 항목의 요소만 직접 업데이트
window.updateField=(panel,id,field,val)=>{
  const item=(state[panel]||[]).find(i=>i.id===id);
  if(!item) return;
  if(field==='price'||field==='qty') item[field]=parseFloat(val)||0;
  else item[field]=val;
  
  renderSummary(); 
  scheduleSave();

  // DOM을 통째로 갈아엎는 대신 필요한 부분(합계 텍스트)만 바꿔치기
  if(field==='price'||field==='qty'){
    const el=document.querySelector(`[data-id="${id}"] .item-total`);
    const total=(item.price||0)*(item.qty||1);
    if(el) {
      el.textContent = total > 0 ? fmt(total) + '원' : ''; 
    }
  }
};

window.delItem=(panel,id)=>{ state[panel]=(state[panel]||[]).filter(i=>i.id!==id); render(); scheduleSave(); };
window.addItem = panel => {
  // 👇 수정됨: nextId 대신 현재 시간(밀리초)을 사용하여 절대 겹치지 않는 고유 ID 생성
  const id = Date.now(); 
  
  if(!state[panel]) state[panel]=[];
  if(panel==='fridge') state.fridge.push({id,name:'새 품목'});
  else state[panel].push({id,name:'새 품목',price:0,qty:1,weight:''});
  
  render(); 
  scheduleSave();
  
  setTimeout(()=>{ 
    const inp=document.querySelectorAll(`[data-id="${id}"] .name-input`); 
    if(inp.length){inp[0].focus();inp[0].select();} 
  }, 60);
};

// 확장 프로그램 동기화 브릿지
window.__syncFromExtension = (products) => {
  if (!state || !currentUser) { showToast('로그인 후 동기화할 수 있어요'); return; }
  let addedCount = 0;
  let updatedCount = 0;

  products.forEach(p => {
    const panel = p.source === 'kurly' ? 'kurly' : 'coupang';
    if (!state[panel]) state[panel] = [];

    const existing = state[panel].find(i => i.name === p.name);
    if (existing) {
      if (p.price)  existing.price  = p.price;
      if (p.weight) existing.weight = p.weight;
      if (p.qty)    existing.qty    = p.qty;
      updatedCount++;
    } else {
      // 👇 수정됨: 동시에 여러 개가 추가될 때를 대비해 랜덤값을 약간 더해 완벽한 고유 ID 생성
      const id = Date.now() + Math.floor(Math.random() * 10000); 
      
      state[panel].push({ id, name: p.name, price: p.price || 0, qty: p.qty || 1, weight: p.weight || '' });
      addedCount++;
    }
  });

  render();
  scheduleSave();

  const msg = [
    addedCount   > 0 ? `${addedCount}개 추가됨`      : '',
    updatedCount > 0 ? `${updatedCount}개 가격 갱신됨` : '',
  ].filter(Boolean).join(' · ');
  showToast('📦 ' + msg);
};

// chrome extension → postMessage 수신
window.addEventListener('message', (e) => {
  if (e.data && e.data.type === 'SYNC_PRODUCTS') {
    window.__syncFromExtension(e.data.products);
  }
});

window.copyText=()=>{
  if(!state) return;
  const kT=(state.kurly||[]).reduce((s,i)=>s+(i.price||0)*(i.qty||1),0);
  const cT=(state.coupang||[]).reduce((s,i)=>s+(i.price||0)*(i.qty||1),0);
  const lines=['📋 장보기 가격 비교표','─'.repeat(30),'','🧊 냉장고 재고',
    ...(state.fridge||[]).map(i=>`  • ${i.name}`),'',
    `🛍 마켓컬리 (합계: ${fmt(kT)}원)`,
    ...(state.kurly||[]).map(i=>`  • ${i.name} | ${fmt(i.price)}원 × ${i.qty}개${i.weight?' | '+i.weight:''} → ${fmt((i.price||0)*(i.qty||1))}원`),'',
    `📦 쿠팡 (합계: ${fmt(cT)}원)`,
    ...(state.coupang||[]).map(i=>`  • ${i.name} | ${fmt(i.price)}원 × ${i.qty}개${i.weight?' | '+i.weight:''} → ${fmt((i.price||0)*(i.qty||1))}원`),
  ];
  navigator.clipboard.writeText(lines.join('\n')).then(()=>showToast('클립보드에 복사됐어요!')).catch(()=>showToast('복사 실패'));
};
</script>
</body>
</html>
