<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>장보기 가격 비교</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F6F2;
    --surface: #FFFFFF;
    --surface2: #F0EEE8;
    --border: #E2DFD6;
    --border2: #CBC7BC;
    --text: #1A1916;
    --text2: #6B6760;
    --text3: #A09D97;
    --fridge-bg: #E8F4EC;
    --fridge-border: #A8D5B4;
    --fridge-text: #1E6B38;
    --fridge-accent: #2E9B52;
    --kurly-bg: #EEE8F8;
    --kurly-border: #C4AEE8;
    --kurly-text: #4B2A9B;
    --kurly-accent: #6B3FBF;
    --coupang-bg: #FFF0E8;
    --coupang-border: #F5C09A;
    --coupang-text: #A84010;
    --coupang-accent: #E05A1A;
    --danger: #E03A3A;
    --success: #1E8A4C;
    --radius: 10px;
    --radius-sm: 6px;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.08), 0 2px 4px rgba(0,0,0,0.04);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* Header */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: var(--shadow);
  }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .logo {
    font-size: 17px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.3px;
  }
  .logo span { color: var(--kurly-accent); }
  .header-date {
    font-size: 12px;
    color: var(--text3);
    font-family: 'DM Mono', monospace;
  }
  .header-actions { display: flex; gap: 8px; }
  .btn {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px;
    font-weight: 500;
    padding: 7px 14px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border2);
    background: var(--surface);
    color: var(--text2);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.15s;
  }
  .btn:hover { background: var(--surface2); color: var(--text); border-color: var(--border2); }
  .btn-primary {
    background: var(--text);
    color: white;
    border-color: var(--text);
  }
  .btn-primary:hover { background: #333; color: white; }

  /* Main */
  .main { padding: 1.5rem 2rem 3rem; max-width: 1400px; margin: 0 auto; }

  /* Summary bar */
  .summary-bar {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 1.5rem;
  }
  .summary-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
  }
  .summary-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
  }
  .summary-card.fridge::before { background: var(--fridge-accent); }
  .summary-card.kurly::before { background: var(--kurly-accent); }
  .summary-card.coupang::before { background: var(--coupang-accent); }
  .summary-label {
    font-size: 12px;
    color: var(--text3);
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .summary-value {
    font-size: 24px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.5px;
    font-family: 'DM Mono', monospace;
  }
  .summary-sub {
    font-size: 11px;
    color: var(--text3);
    margin-top: 3px;
  }
  .cheaper-badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 4px;
    background: #D4F0E0;
    color: var(--success);
  }

  /* Grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 16px;
    align-items: start;
  }

  /* Panel */
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .panel-header {
    padding: 14px 16px 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .panel-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .panel-icon {
    width: 28px; height: 28px;
    border-radius: var(--radius-sm);
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
  }
  .panel-icon.fridge { background: var(--fridge-bg); }
  .panel-icon.kurly { background: var(--kurly-bg); }
  .panel-icon.coupang { background: var(--coupang-bg); }
  .badge {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 20px;
    letter-spacing: 0.2px;
  }
  .badge.fridge { background: var(--fridge-bg); color: var(--fridge-text); border: 1px solid var(--fridge-border); }
  .badge.kurly { background: var(--kurly-bg); color: var(--kurly-text); border: 1px solid var(--kurly-border); }
  .badge.coupang { background: var(--coupang-bg); color: var(--coupang-text); border: 1px solid var(--coupang-border); }

  .panel-body { padding: 10px 12px 12px; }

  /* Items */
  .item {
    padding: 10px 8px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-start;
    gap: 8px;
    animation: fadeIn 0.2s ease;
  }
  .item:last-child { border-bottom: none; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

  .item-body { flex: 1; min-width: 0; }
  .name-input {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    background: transparent;
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    padding: 3px 6px;
    width: 100%;
    cursor: pointer;
    transition: all 0.15s;
  }
  .name-input:hover { background: var(--surface2); border-color: var(--border); }
  .name-input:focus { background: var(--surface2); border-color: var(--border2); outline: none; cursor: text; }

  .fields {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 6px;
    margin-top: 6px;
  }
  .field { display: flex; flex-direction: column; gap: 2px; }
  .field-label {
    font-size: 10px;
    color: var(--text3);
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  .field-input {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--text);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 4px 7px;
    width: 100%;
    transition: border-color 0.15s;
  }
  .field-input:focus { outline: none; border-color: var(--border2); background: var(--surface); }

  .item-total {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    font-weight: 500;
    color: var(--text);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 3px 8px;
    white-space: nowrap;
    flex-shrink: 0;
    align-self: flex-end;
    margin-bottom: 2px;
  }

  .del-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text3);
    font-size: 16px;
    padding: 3px;
    border-radius: 4px;
    transition: all 0.15s;
    flex-shrink: 0;
    line-height: 1;
    margin-top: 3px;
  }
  .del-btn:hover { color: var(--danger); background: #FEE8E8; }

  .empty-state {
    text-align: center;
    padding: 24px 0;
    color: var(--text3);
    font-size: 13px;
  }

  .add-btn {
    width: 100%;
    margin-top: 8px;
    padding: 8px;
    background: none;
    border: 1px dashed var(--border2);
    border-radius: var(--radius-sm);
    color: var(--text3);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    transition: all 0.15s;
  }
  .add-btn:hover { border-color: var(--text2); color: var(--text2); background: var(--surface2); }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--text);
    color: white;
    padding: 10px 20px;
    border-radius: var(--radius);
    font-size: 13px;
    font-weight: 500;
    opacity: 0;
    transition: all 0.3s ease;
    z-index: 999;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Responsive */
  @media (max-width: 900px) {
    .main { padding: 1rem; }
    .grid { grid-template-columns: 1fr; }
    .summary-bar { grid-template-columns: 1fr; }
    .header { padding: 0 1rem; }
    .fields { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 600px) {
    .header-date { display: none; }
    .logo { font-size: 15px; }
    .summary-value { font-size: 20px; }
  }
</style>
</head>
<body>

<header class="header">
  <div class="header-left">
    <div class="logo">장보기 <span>비교표</span></div>
    <div class="header-date" id="todayDate"></div>
  </div>
  <div class="header-actions">
    <button class="btn" onclick="clearAll()">🗑 초기화</button>
    <button class="btn btn-primary" onclick="copyText()">📋 복사하기</button>
  </div>
</header>

<main class="main">
  <div class="summary-bar" id="summaryBar"></div>
  <div class="grid" id="mainGrid"></div>
</main>

<div class="toast" id="toast"></div>

<script>
// ─── 초기 데이터 ───────────────────────────────
const DEFAULT = {
  fridge: [
    {id:1,name:'계란 (30구)'},
    {id:2,name:'우유 1L'},
    {id:3,name:'두부 300g'},
    {id:4,name:'요거트'},
    {id:5,name:'버터'},
  ],
  kurly: [
    {id:1,name:'유기농 계란 (15구)',price:6800,qty:1,weight:''},
    {id:2,name:'서울우유 1L',price:2400,qty:2,weight:'1000g'},
    {id:3,name:'풀무원 두부',price:2200,qty:1,weight:'300g'},
    {id:4,name:'그릭요거트',price:4500,qty:1,weight:'200g'},
  ],
  coupang: [
    {id:1,name:'동물복지 계란 (30구)',price:11900,qty:1,weight:'1.8kg'},
    {id:2,name:'매일 우유 1L',price:2100,qty:2,weight:'1000g'},
    {id:3,name:'CJ 두부 찌개용',price:1980,qty:1,weight:'300g'},
    {id:4,name:'남양 떠먹는 요거트',price:3200,qty:2,weight:'150g'},
    {id:5,name:'앵커 버터',price:6800,qty:1,weight:'454g'},
  ]
};

// ─── 상태 ─────────────────────────────────────
function loadState() {
  try {
    const saved = localStorage.getItem('jangbogi-v1');
    return saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(DEFAULT));
  } catch { return JSON.parse(JSON.stringify(DEFAULT)); }
}
function saveState() {
  try { localStorage.setItem('jangbogi-v1', JSON.stringify(state)); } catch {}
}
let state = loadState();
let nextId = { fridge: 200, kurly: 200, coupang: 200 };

// ─── 유틸 ─────────────────────────────────────
function fmt(n) { return Number(n||0).toLocaleString('ko-KR'); }
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// ─── 날짜 ─────────────────────────────────────
(function() {
  const d = new Date();
  document.getElementById('todayDate').textContent =
    d.getFullYear() + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + String(d.getDate()).padStart(2,'0');
})();

// ─── 렌더 ─────────────────────────────────────
const PANELS = [
  { key:'fridge',  label:'냉장고 재고',      icon:'🧊', cls:'fridge',  badgeText:'재고' },
  { key:'kurly',   label:'마켓컬리',          icon:'🛍', cls:'kurly',   badgeText:'Kurly' },
  { key:'coupang', label:'쿠팡 / 쿠팡프레시', icon:'📦', cls:'coupang', badgeText:'Coupang' },
];

function renderFridgeItem(item) {
  return `<div class="item" data-id="${item.id}">
    <div class="item-body">
      <input class="name-input" value="${esc(item.name)}"
        onchange="update('fridge',${item.id},'name',this.value)"
        placeholder="품목 이름">
    </div>
    <button class="del-btn" onclick="del('fridge',${item.id})" title="삭제">×</button>
  </div>`;
}

function renderShopItem(panel, item) {
  const total = (item.price||0) * (item.qty||1);
  return `<div class="item" data-id="${item.id}">
    <div class="item-body">
      <input class="name-input" value="${esc(item.name)}"
        onchange="update('${panel}',${item.id},'name',this.value)"
        placeholder="품목 이름">
      <div class="fields">
        <div class="field">
          <span class="field-label">가격 (원)</span>
          <input class="field-input" type="number" min="0" value="${item.price||''}"
            placeholder="0"
            onchange="update('${panel}',${item.id},'price',this.value)">
        </div>
        <div class="field">
          <span class="field-label">수량</span>
          <input class="field-input" type="number" min="1" value="${item.qty||1}"
            onchange="update('${panel}',${item.id},'qty',this.value)">
        </div>
        <div class="field">
          <span class="field-label">무게/용량</span>
          <input class="field-input" type="text" value="${esc(item.weight||'')}"
            placeholder="예) 500g"
            onchange="update('${panel}',${item.id},'weight',this.value)">
        </div>
      </div>
    </div>
    ${total > 0 ? `<div class="item-total">${fmt(total)}원</div>` : ''}
    <button class="del-btn" onclick="del('${panel}',${item.id})" title="삭제">×</button>
  </div>`;
}

function esc(s) { return String(s||'').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

function render() {
  const grid = document.getElementById('mainGrid');
  grid.innerHTML = PANELS.map(p => {
    const items = state[p.key];
    const rows = p.key === 'fridge'
      ? items.map(i => renderFridgeItem(i)).join('')
      : items.map(i => renderShopItem(p.key, i)).join('');
    return `<div class="panel">
      <div class="panel-header">
        <div class="panel-title">
          <div class="panel-icon ${p.cls}">${p.icon}</div>
          ${p.label}
        </div>
        <span class="badge ${p.cls}">${p.badgeText}</span>
      </div>
      <div class="panel-body">
        ${rows || '<div class="empty-state">항목이 없어요</div>'}
        <button class="add-btn" onclick="add('${p.key}')">+ 항목 추가</button>
      </div>
    </div>`;
  }).join('');
  renderSummary();
  saveState();
}

function renderSummary() {
  const kTotal = state.kurly.reduce((s,i)=>s+(i.price||0)*(i.qty||1),0);
  const cTotal = state.coupang.reduce((s,i)=>s+(i.price||0)*(i.qty||1),0);
  const diff = kTotal - cTotal;
  let cheaperHtml = '';
  if (kTotal > 0 && cTotal > 0) {
    if (diff > 0) cheaperHtml = `<span class="cheaper-badge">쿠팡이 ${fmt(diff)}원 저렴</span>`;
    else if (diff < 0) cheaperHtml = `<span class="cheaper-badge">마켓컬리가 ${fmt(-diff)}원 저렴</span>`;
    else cheaperHtml = `<span class="cheaper-badge">두 곳 동일</span>`;
  }
  document.getElementById('summaryBar').innerHTML = `
    <div class="summary-card fridge">
      <div class="summary-label">🧊 냉장고 재고</div>
      <div class="summary-value">${state.fridge.length}<span style="font-size:14px;font-weight:400;color:var(--text2);margin-left:4px">품목</span></div>
      <div class="summary-sub">현재 보관 중인 식재료</div>
    </div>
    <div class="summary-card kurly">
      <div class="summary-label">🛍 마켓컬리 합계</div>
      <div class="summary-value">${fmt(kTotal)}<span style="font-size:14px;font-weight:400;color:var(--text2);margin-left:4px">원</span></div>
      <div class="summary-sub">${state.kurly.length}개 품목</div>
    </div>
    <div class="summary-card coupang">
      <div class="summary-label">📦 쿠팡 합계</div>
      <div class="summary-value">${fmt(cTotal)}<span style="font-size:14px;font-weight:400;color:var(--text2);margin-left:4px">원</span></div>
      <div class="summary-sub">${state.coupang.length}개 품목 &nbsp;${cheaperHtml}</div>
    </div>`;
}

// ─── 동작 ─────────────────────────────────────
function update(panel, id, field, val) {
  const item = state[panel].find(i => i.id === id);
  if (!item) return;
  if (field === 'price' || field === 'qty') item[field] = parseFloat(val) || 0;
  else item[field] = val;
  renderSummary();
  saveState();
  if (field === 'price' || field === 'qty') {
    const el = document.querySelector(`[data-id="${id}"] .item-total`);
    const total = (item.price||0)*(item.qty||1);
    if (el) el.textContent = fmt(total) + '원';
    else render();
  }
}

function del(panel, id) {
  state[panel] = state[panel].filter(i => i.id !== id);
  render();
}

function add(panel) {
  const id = nextId[panel]++;
  if (panel === 'fridge') state.fridge.push({id, name:'새 품목'});
  else state[panel].push({id, name:'새 품목', price:0, qty:1, weight:''});
  render();
  setTimeout(() => {
    const inputs = document.querySelectorAll(`[data-id="${id}"] .name-input`);
    if (inputs.length) { inputs[0].focus(); inputs[0].select(); }
  }, 60);
}

function clearAll() {
  if (!confirm('모든 데이터를 초기화할까요?')) return;
  state = JSON.parse(JSON.stringify(DEFAULT));
  render();
  showToast('초기화됐어요!');
}

function copyText() {
  const kTotal = state.kurly.reduce((s,i)=>s+(i.price||0)*(i.qty||1),0);
  const cTotal = state.coupang.reduce((s,i)=>s+(i.price||0)*(i.qty||1),0);
  const lines = [
    '📋 장보기 가격 비교표',
    '─'.repeat(30),
    '',
    '🧊 냉장고 재고',
    ...state.fridge.map(i=>`  • ${i.name}`),
    '',
    '🛍 마켓컬리 (합계: ' + fmt(kTotal) + '원)',
    ...state.kurly.map(i=>`  • ${i.name} | ${fmt(i.price)}원 × ${i.qty}개${i.weight?' | '+i.weight:''} → ${fmt((i.price||0)*(i.qty||1))}원`),
    '',
    '📦 쿠팡 (합계: ' + fmt(cTotal) + '원)',
    ...state.coupang.map(i=>`  • ${i.name} | ${fmt(i.price)}원 × ${i.qty}개${i.weight?' | '+i.weight:''} → ${fmt((i.price||0)*(i.qty||1))}원`),
  ];
  navigator.clipboard.writeText(lines.join('\n'))
    .then(() => showToast('클립보드에 복사됐어요!'))
    .catch(() => showToast('복사에 실패했어요'));
}

// ─── 초기 렌더 ────────────────────────────────
render();
</script>
</body>
</html>
