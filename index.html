<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>장보기 가격 비교</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="loadingOverlay">
  <div class="spinner"></div>
  <div style="font-size:13px;color:var(--text3);margin-top:4px">불러오는 중...</div>
</div>

<div id="loginScreen" style="display:none">
  <div class="login-card">
    <div class="login-logo">🛒</div>
    <div class="login-title">장보기 가격 비교</div>
    <div class="login-sub">냉장고 재고와 쇼핑몰 가격을<br>한눈에 비교해보세요</div>
    <button class="google-btn" onclick="signInWithGoogle()">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
      Google 계정으로 로그인
    </button>
    <div class="login-note">로그인 시 계정별로 데이터가 저장됩니다</div>
  </div>
</div>

<div id="appScreen">
  <header class="header">
    <div class="header-left">
      <div class="logo">장보기 <span>비교표</span></div>
      <div class="save-dot" id="saveDot" title="저장 상태"></div>
    </div>
    <div class="header-right">
      <div class="user-chip">
        <img class="user-avatar" id="userAvatar" src="" alt="" style="display:none">
        <div class="user-avatar-fallback" id="userFallback" style="display:none"></div>
        <span class="user-name" id="userName"></span>
      </div>
      <button class="btn" onclick="openAddShopModal()">＋ 쇼핑몰 추가</button>
      <button class="btn" onclick="copyText()">📋 복사</button>
      <button class="btn btn-danger" onclick="doSignOut()">로그아웃</button>
    </div>
  </header>
  <main class="main">
    <div class="summary-bar" id="summaryBar"></div>
    <div class="grid" id="mainGrid"></div>
  </main>
</div>

<div id="modalOverlay" style="display:none" onclick="closeAddShopModal(event)">
  <div class="modal-card" onclick="event.stopPropagation()">
    <div class="modal-title">쇼핑몰 추가</div>
    <div class="modal-body">
      <div class="modal-field">
        <label class="modal-label">쇼핑몰 이름 <span style="color:#E03A3A">*</span></label>
        <input class="modal-input" id="newShopName" type="text" placeholder="예) 오아시스마켓">
      </div>
      <div class="modal-field">
        <label class="modal-label">아이콘 (이모지)</label>
        <input class="modal-input" id="newShopIcon" type="text" placeholder="예) 🛒" maxlength="4">
      </div>
      <div class="modal-field">
        <label class="modal-label">배지 텍스트</label>
        <input class="modal-input" id="newShopBadge" type="text" placeholder="예) Oasis" maxlength="10">
      </div>
      <div class="modal-preset-label">자주 쓰는 쇼핑몰</div>
      <div class="modal-presets" id="presetList"></div>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeAddShopModal()">취소</button>
      <button class="btn btn-primary" onclick="addShop()">추가하기</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut as fbSignOut }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA4ugXKglqEC5Oq4imFWbwFhWUlzGSI0DE",
  authDomain: "jangbogi-6b765.firebaseapp.com",
  projectId: "jangbogi-6b765",
  storageBucket: "jangbogi-6b765.firebasestorage.app",
  messagingSenderId: "976301065070",
  appId: "1:976301065070:web:4c08bb2f47cafeee84777f",
  measurementId: "G-K11HRB2SV8"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

const SHOP_PRESETS = [
  { name:'마켓컬리',   icon:'🛍', badge:'Kurly',    key:'kurly'   },
  { name:'쿠팡',       icon:'📦', badge:'Coupang',  key:'coupang' },
  { name:'오아시스',   icon:'🌿', badge:'Oasis',    key:'oasis'   },
  { name:'SSG닷컴',    icon:'🛒', badge:'SSG',      key:'ssg'     },
  { name:'홈플러스',   icon:'🏪', badge:'Homeplus', key:'homeplus'},
  { name:'이마트몰',   icon:'🟡', badge:'emart',    key:'emart'   },
  { name:'GS프레시',   icon:'🟢', badge:'GS',       key:'gs'      },
  { name:'롯데마트',   icon:'🔴', badge:'Lotte',    key:'lotte'   },
];

const DEFAULT_DATA = {
  fridge:  [{id:1,name:'계란 (30구)'},{id:2,name:'우유 1L'},{id:3,name:'두부 300g'}],
  kurly:   [{id:1,name:'유기농 계란 (15구)',price:6800,qty:1,weight:''},{id:2,name:'서울우유 1L',price:2400,qty:2,weight:'1000g'}],
  coupang: [{id:1,name:'동물복지 계란 (30구)',price:11900,qty:1,weight:'1.8kg'},{id:2,name:'매일 우유 1L',price:2100,qty:2,weight:'1000g'}],
  _shops: [
    { key:'kurly',   name:'마켓컬리',          icon:'🛍', badge:'Kurly'   },
    { key:'coupang', name:'쿠팡 / 쿠팡프레시', icon:'📦', badge:'Coupang' },
  ]
};

let state = null;
let currentUser = null;
let saveTimer = null;

const fmt = n => Number(n||0).toLocaleString('ko-KR');
const esc = s => String(s||'').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const slugify = s => s.replace(/\s+/g,'_').replace(/[^a-zA-Z0-9_가-힣]/g,'').toLowerCase() + '_' + Date.now();

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}
function setSaveDot(st){
  const d=document.getElementById('saveDot');
  d.className='save-dot'+(st?' '+st:'');
}

const userDocRef = uid => doc(db,'users',uid,'data','main');

async function loadData(uid){
  const snap = await getDoc(userDocRef(uid));
  if(snap.exists()){
    state = snap.data();
    if(!state._shops) state._shops = JSON.parse(JSON.stringify(DEFAULT_DATA._shops));
  } else {
    state = JSON.parse(JSON.stringify(DEFAULT_DATA));
    await setDoc(userDocRef(uid), state);
  }
}

function scheduleSave(){
  setSaveDot('saving');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    if(!currentUser) return;
    try {
      await setDoc(userDocRef(currentUser.uid), state);
      setSaveDot('saved');
      setTimeout(()=>setSaveDot(''),2000);
    } catch(e){ showToast('저장 실패: '+e.message); setSaveDot(''); }
  }, 800);
}

window.signInWithGoogle = async () => {
  try { await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch(e){ showToast('로그인 실패: '+e.message); }
};
window.doSignOut = async () => {
  if(!confirm('로그아웃할까요?')) return;
  await fbSignOut(auth);
};

onAuthStateChanged(auth, async user => {
  const overlay  = document.getElementById('loadingOverlay');
  const loginScr = document.getElementById('loginScreen');
  const appScr   = document.getElementById('appScreen');

  if(user){
    currentUser = user;
    try { await loadData(user.uid); }
    catch(e){ state = JSON.parse(JSON.stringify(DEFAULT_DATA)); showToast('데이터 로드 오류'); }

    const avatarEl   = document.getElementById('userAvatar');
    const fallbackEl = document.getElementById('userFallback');
    if(user.photoURL){ avatarEl.src=user.photoURL; avatarEl.style.display='block'; }
    else { fallbackEl.textContent=(user.displayName||'U')[0]; fallbackEl.style.display='flex'; }
    document.getElementById('userName').textContent = user.displayName || user.email;

    loginScr.style.display='none';
    appScr.style.display='block';
    overlay.classList.add('hidden');
    render();
  } else {
    currentUser=null; state=null;
    appScr.style.display='none';
    overlay.classList.add('hidden');
    loginScr.style.display='flex';
  }
});

function renderFridgeItem(item){
  const checkStyle = item.confirmed ? 'display:none;' : '';
  return `<div class="item" data-id="${item.id}">
    <div class="item-body">
      <input class="name-input" value="${esc(item.name)}" placeholder="품목 이름"
        oninput="updateField('fridge',${item.id},'name',this.value)">
    </div>
    <div style="display:flex;gap:4px;">
      <button id="check-btn-fridge-${item.id}" class="del-btn" style="background:#e8f5e9;color:#2e7d32;${checkStyle}" onclick="confirmItem('fridge',${item.id})">✅</button>
      <button class="del-btn" onclick="delItem('fridge',${item.id})">×</button>
    </div>
  </div>`;
}

function renderShopItem(panel,item){
  const total=(item.price||0)*(item.qty||1);
  const checkStyle = item.confirmed ? 'display:none;' : '';
  return `<div class="item" data-id="${item.id}">
    <div class="item-body">
      <input class="name-input" value="${esc(item.name)}" placeholder="품목 이름"
        oninput="updateField('${panel}',${item.id},'name',this.value)">
      <div class="fields">
        <div class="field"><span class="field-label">가격 (원)</span>
          <input class="field-input" type="number" min="0" value="${item.price||''}" placeholder="0"
            oninput="updateField('${panel}',${item.id},'price',this.value)"></div>
        <div class="field"><span class="field-label">수량</span>
          <input class="field-input" type="number" min="1" value="${item.qty||1}"
            oninput="updateField('${panel}',${item.id},'qty',this.value)"></div>
        <div class="field"><span class="field-label">무게/용량</span>
          <input class="field-input" type="text" value="${esc(item.weight||'')}" placeholder="예) 500g"
            oninput="updateField('${panel}',${item.id},'weight',this.value)"></div>
      </div>
    </div>
    ${total>0?`<div class="item-total">${fmt(total)}원</div>`:''}
    <div style="display:flex;gap:4px;align-items:flex-start;">
      <button id="check-btn-${panel}-${item.id}" class="del-btn" style="background:#e8f5e9;color:#2e7d32;${checkStyle}" onclick="confirmItem('${panel}',${item.id})">✅</button>
      <button class="del-btn" onclick="delItem('${panel}',${item.id})">×</button>
    </div>
  </div>`;
}

const FIXED_CLASSES = { kurly: 'kurly', coupang: 'coupang' };

function getShopColor(key) {
  let hash = 0;
  for (let i = 0; i < key.length; i++) hash = key.charCodeAt(i) + ((hash << 5) - hash);
  const h = Math.abs(hash % 360);
  return {
    bg: `hsl(${h}, 40%, 96%)`,
    border: `hsl(${h}, 45%, 85%)`,
    text: `hsl(${h}, 60%, 25%)`,
    accent: `hsl(${h}, 65%, 35%)`
  };
}

function render(){
  if(!state) return;
  const shops = state._shops || [];

  // ✨ 모바일 정렬 오류 해결: CSS 변수(--shop-count)로 개수를 전달하여 반응형(미디어쿼리)을 해치지 않음
  document.documentElement.style.setProperty('--shop-count', shops.length + 1);

  const fridgeItems = (state.fridge||[]).map(i=>renderFridgeItem(i)).join('');
  const fridgePanel = `<div class="panel fridge">
    <div class="panel-header">
      <div class="panel-title"><div class="panel-icon fridge">🧊</div>냉장고 재고</div>
      <span class="badge fridge">재고</span>
    </div>
    <div class="panel-body">
      ${fridgeItems||'<div class="empty-state">항목이 없어요</div>'}
      <button class="add-btn" onclick="addItem('fridge')">+ 항목 추가</button>
    </div>
  </div>`;

  const shopPanels = shops.map((shop) => {
    const items = (state[shop.key]||[]).map(i=>renderShopItem(shop.key,i)).join('');
    const fixedCls = FIXED_CLASSES[shop.key];

    // fixedCls가 없으면 무조건 custom-shop 클래스를 추가하여 CSS 디자인을 받도록 합니다.
    const panelClass = fixedCls || 'custom-shop'; 

    return `<div class="panel ${panelClass}" style="${!fixedCls ? `--shop-bg:${c.bg};--shop-border:${c.border};--shop-text:${c.text};--shop-accent:${c.accent};` : ''}">
    ...
  </div>`;
});
  
    if (fixedCls) {
      return `<div class="panel ${fixedCls}">
        <div class="panel-header">
          <div class="panel-title">
            <div class="panel-icon ${fixedCls}">${shop.icon}</div>
            ${esc(shop.name)}
          </div>
          <div style="display:flex;align-items:center;gap:6px">
            <span class="badge ${fixedCls}">${esc(shop.badge)}</span>
            <button class="panel-del-btn" onclick="removeShop('${shop.key}')" title="쇼핑몰 삭제">🗑</button>
          </div>
        </div>
        <div class="panel-body">
          ${items||'<div class="empty-state">항목이 없어요</div>'}
          <button class="add-btn" onclick="addItem('${shop.key}')">+ 항목 추가</button>
        </div>
      </div>`;
    } else {
      const c = getShopColor(shop.key);
      // ✨ 디자인 오류 해결: custom-shop 클래스를 부여하여 CSS와 완벽 연동
      return `<div class="panel custom-shop" style="--shop-bg:${c.bg};--shop-border:${c.border};--shop-text:${c.text};--shop-accent:${c.accent};">
        <div class="panel-header" style="background: rgba(255,255,255,0.6); border-bottom: 1px solid var(--shop-border);">
          <div class="panel-title">
            <div class="panel-icon" style="background:var(--shop-bg)">${shop.icon}</div>
            ${esc(shop.name)}
          </div>
          <div style="display:flex;align-items:center;gap:6px">
            <span class="badge" style="background:var(--shop-bg);color:var(--shop-accent);border:1px solid var(--shop-border)">${esc(shop.badge)}</span>
            <button class="panel-del-btn" onclick="removeShop('${shop.key}')" title="쇼핑몰 삭제">🗑</button>
          </div>
        </div>
        <div class="panel-body">
          ${items||'<div class="empty-state">항목이 없어요</div>'}
          <button class="add-btn" onclick="addItem('${shop.key}')">+ 항목 추가</button>
        </div>
      </div>`;
    }
  }).join('');

  document.getElementById('mainGrid').innerHTML = fridgePanel + shopPanels;

  document.querySelectorAll('.panel[style*="--shop-accent"]').forEach(el => {
    const accent = getComputedStyle(el).getPropertyValue('--shop-accent').trim();
    el.style.borderTop = `3px solid ${accent}`;
  });

  renderSummary();
}

function renderSummary(){
  if(!state) return;
  const shops = state._shops || [];

  const fridgeCard = `
    <div class="summary-card fridge">
      <div class="summary-label">🧊 냉장고 재고</div>
      <div class="summary-value">${(state.fridge||[]).length}<span style="font-size:14px;font-weight:400;color:var(--text2);margin-left:4px">품목</span></div>
      <div class="summary-sub">현재 보관 중인 식재료</div>
    </div>`;

  const shopCards = shops.map((shop) => {
    const total = (state[shop.key]||[]).reduce((s,i)=>s+(i.price||0)*(i.qty||1),0);
    const fixedCls = FIXED_CLASSES[shop.key];
    if (fixedCls) {
      return `<div class="summary-card ${fixedCls}">
        <div class="summary-label">${shop.icon} ${esc(shop.name)}</div>
        <div class="summary-value">${fmt(total)}<span style="font-size:14px;font-weight:400;color:var(--text2);margin-left:4px">원</span></div>
        <div class="summary-sub">${(state[shop.key]||[]).length}개 품목</div>
      </div>`;
    } else {
      const c = getShopColor(shop.key);
      return `<div class="summary-card custom-shop" style="--shop-bg:${c.bg};--shop-border:${c.border};--shop-text:${c.text};--shop-accent:${c.accent}; border-color:var(--shop-border);">
        <div class="summary-card-decor" style="position:absolute; top:0; left:0; right:0; height:4px; background:var(--shop-accent);"></div>
        <div class="summary-label" style="color:var(--shop-text);">${shop.icon} ${esc(shop.name)}</div>
        <div class="summary-value">${fmt(total)}<span style="font-size:14px;font-weight:400;color:var(--text2);margin-left:4px">원</span></div>
        <div class="summary-sub">${(state[shop.key]||[]).length}개 품목</div>
      </div>`;
    }
  }).join('');

  let cheapestHtml = '';
  if(shops.length >= 2){
    const totals = shops.map(s=>({ name:s.name, total:(state[s.key]||[]).reduce((a,i)=>a+(i.price||0)*(i.qty||1),0) }))
      .filter(s=>s.total>0);
    if(totals.length >= 2){
      totals.sort((a,b)=>a.total-b.total);
      const diff = totals[1].total - totals[0].total;
      cheapestHtml = `<div style="grid-column:1/-1;text-align:center;font-size:13px;color:var(--success,#1E8A4C);font-weight:600;padding:8px 0;background:#E8F5E9;border-radius:6px;margin-top:8px;">
        💡 ${esc(totals[0].name)}이(가) 다른 곳보다 ${fmt(diff)}원 더 저렴해요!
      </div>`;
    }
  }

  document.getElementById('summaryBar').innerHTML = fridgeCard + shopCards + cheapestHtml;
}

window.openAddShopModal = () => {
  document.getElementById('newShopName').value  = '';
  document.getElementById('newShopIcon').value  = '';
  document.getElementById('newShopBadge').value = '';

  const existingKeys = (state._shops||[]).map(s=>s.key);
  document.getElementById('presetList').innerHTML = SHOP_PRESETS.map(p=>`
    <button class="preset-chip" onclick="fillPreset('${p.key}')"
      style="${existingKeys.includes(p.key)?'opacity:0.35;pointer-events:none;':''}"
    >${p.icon} ${p.name}</button>
  `).join('');

  document.getElementById('modalOverlay').style.display = 'flex';
  setTimeout(()=>document.getElementById('newShopName').focus(), 100);
};

window.closeAddShopModal = (e) => {
  if(e && e.target !== document.getElementById('modalOverlay')) return;
  document.getElementById('modalOverlay').style.display = 'none';
};

window.fillPreset = (key) => {
  const p = SHOP_PRESETS.find(x=>x.key===key);
  if(!p) return;
  document.getElementById('newShopName').value  = p.name;
  document.getElementById('newShopIcon').value  = p.icon;
  document.getElementById('newShopBadge').value = p.badge;
};

window.addShop = () => {
  const name  = document.getElementById('newShopName').value.trim();
  const icon  = document.getElementById('newShopIcon').value.trim()  || '🛒';
  const badge = document.getElementById('newShopBadge').value.trim() || name;
  if(!name){ showToast('쇼핑몰 이름을 입력해주세요'); return; }

  const preset = SHOP_PRESETS.find(p=>p.name===name);
  const key = preset ? preset.key : slugify(name);

  if((state._shops||[]).find(s=>s.key===key)){
    showToast('이미 추가된 쇼핑몰이에요'); return;
  }

  if(!state._shops) state._shops = [];
  state._shops.push({ key, name, icon, badge });
  if(!state[key]) state[key] = [];

  document.getElementById('modalOverlay').style.display = 'none';
  render();
  scheduleSave();
  showToast(`${icon} ${name} 추가됐어요!`);
};

window.removeShop = (key) => {
  const shop = (state._shops||[]).find(s=>s.key===key);
  if(!shop) return;
  if(!confirm(`'${shop.name}' 패널을 삭제할까요?\n항목 데이터도 함께 삭제됩니다.`)) return;
  state._shops = state._shops.filter(s=>s.key!==key);
  delete state[key];
  render();
  scheduleSave();
  showToast(`${shop.name} 삭제됐어요`);
};

window.updateField=(panel,id,field,val)=>{
  const item=(state[panel]||[]).find(i=>i.id===id);
  if(!item) return;
  if(field==='price'||field==='qty') item[field]=parseFloat(val)||0;
  else item[field]=val;
  item.confirmed = false;
  renderSummary(); scheduleSave();
  if(field==='price'||field==='qty'){
    const el=document.querySelector(`[data-id="${id}"] .item-total`);
    const total=(item.price||0)*(item.qty||1);
    if(el) el.textContent=fmt(total)+'원';
  }
  const checkBtn=document.getElementById(`check-btn-${panel}-${id}`);
  if(checkBtn) checkBtn.style.display='';
};

window.confirmItem=(panel,id)=>{
  if(document.activeElement) document.activeElement.blur();
  const item=(state[panel]||[]).find(i=>i.id===id);
  if(item){ item.confirmed=true; scheduleSave(); }
  const checkBtn=document.getElementById(`check-btn-${panel}-${id}`);
  if(checkBtn) checkBtn.style.display='none';
  showToast('✅ 등록이 완료되었습니다');
};

window.delItem=(panel,id)=>{
  state[panel]=(state[panel]||[]).filter(i=>i.id!==id);
  render(); scheduleSave();
};

window.addItem=panel=>{
  const id=Date.now();
  if(!state[panel]) state[panel]=[];
  if(panel==='fridge') state.fridge.push({id,name:''});
  else state[panel].push({id,name:'',price:0,qty:1,weight:''});
  render(); scheduleSave();
  setTimeout(()=>{ const inp=document.querySelectorAll(`[data-id="${id}"] .name-input`); if(inp.length){inp[0].focus();inp[0].select();} },60);
};

window.__syncFromExtension=(products)=>{
  if(!state||!currentUser){ showToast('로그인 후 동기화할 수 있어요'); return; }
  let addedCount=0, updatedCount=0;
  products.forEach(p=>{
    const panel=p.source==='kurly'?'kurly':'coupang';
    if(!state[panel]) state[panel]=[];
    const existing=state[panel].find(i=>i.name===p.name);
    if(existing){
      if(p.price)  existing.price=p.price;
      if(p.weight) existing.weight=p.weight;
      if(p.qty)    existing.qty=p.qty;
      updatedCount++;
    } else {
      state[panel].push({id:Date.now(),name:p.name,price:p.price||0,qty:p.qty||1,weight:p.weight||''});
      addedCount++;
    }
  });
  render(); scheduleSave();
  const msg=[addedCount>0?`${addedCount}개 추가됨`:'',updatedCount>0?`${updatedCount}개 가격 갱신됨`:''].filter(Boolean).join(' · ');
  showToast('📦 '+msg);
};

window.addEventListener('message',(e)=>{
  if(e.data&&e.data.type==='SYNC_PRODUCTS') window.__syncFromExtension(e.data.products);
});

window.copyText=()=>{
  if(!state) return;
  const shops=state._shops||[];
  const lines=['📋 장보기 가격 비교표','─'.repeat(30),'','🧊 냉장고 재고',
    ...(state.fridge||[]).map(i=>`  • ${i.name}`),''];
  shops.forEach(s=>{
    const total=(state[s.key]||[]).reduce((a,i)=>a+(i.price||0)*(i.qty||1),0);
    lines.push(`${s.icon} ${s.name} (합계: ${fmt(total)}원)`);
    (state[s.key]||[]).forEach(i=>lines.push(`  • ${i.name} | ${fmt(i.price)}원 × ${i.qty}개${i.weight?' | '+i.weight:''} → ${fmt((i.price||0)*(i.qty||1))}원`));
    lines.push('');
  });
  navigator.clipboard.writeText(lines.join('\n')).then(()=>showToast('클립보드에 복사됐어요!')).catch(()=>showToast('복사 실패'));
};
</script>
